# ── kitty.conf ──────────────────────────────────────────────────────────────
# Tailored for: Hyprland, Neovim, Yazi, Catppuccin Mocha
# Transparency is handled by Hyprland window rules — kitty stays opaque.

# ── Theme ───────────────────────────────────────────────────────────────────
include themes/catppuccin-mocha.conf

# ── Font ────────────────────────────────────────────────────────────────────
font_family       JetBrainsMono Nerd Font
bold_font         JetBrainsMono Nerd Font Bold
italic_font       JetBrainsMono Nerd Font Italic
bold_italic_font  JetBrainsMono Nerd Font Bold Italic
font_size         11.0

# Ligatures — disable if they feel slow in neovim
# font_features JetBrainsMonoNF-Regular +liga +calt

# ── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape            block
cursor_blink_interval   0
cursor_stop_blinking_after 0

# ── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ────────────────────────────────────────────────────────────────────
mouse_hide_wait         2.0
copy_on_select          no
focus_follows_mouse     no

# ── Performance ─────────────────────────────────────────────────────────────
repaint_delay           8
input_delay             2
sync_to_monitor         yes

# ── Bell ────────────────────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.0

# ── Window ──────────────────────────────────────────────────────────────────
remember_window_size    no
initial_window_width    100c
initial_window_height   28c
window_padding_width    8
placement_strategy      center

# No border — Hyprland draws its own
draw_minimal_borders    yes
window_border_width     0

# Needed for Neovim background to match properly
background_opacity      0.7
# ── Tab bar ─────────pay as you go ntc────────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# ── URL handling ─────────────────────────────────────────────────────────────
url_style               single
open_url_with           default
detect_urls             yes

# ── Clipboard ────────────────────────────────────────────────────────────────
clipboard_control       write-clipboard write-primary read-clipboard-ask read-primary-ask

# ── Shell integration ────────────────────────────────────────────────────────
# Enables jumping to previous prompts, cloning cwd, etc.
shell_integration       enabled

# ── Keyboard shortcuts ───────────────────────────────────────────────────────
# Clear defaults, define only what's needed
clear_all_shortcuts     no

# Tabs
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+w        close_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+1        goto_tab 1
map ctrl+shift+2        goto_tab 2
map ctrl+shift+3        goto_tab 3

# Splits (useful alongside yazi / neovim)
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window

# Font size
map ctrl+equal          change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Scrollback in neovim-friendly pager
map ctrl+shift+h        show_scrollback

# Paste
map ctrl+shift+v        paste_from_clipboard

# ── Misc ─────────────────────────────────────────────────────────────────────
term                    xterm-kitty
update_check_interval   0


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

