# hyprlock.conf
# Place at: ~/.config/hypr/hyprlock.conf

$font     = JetBrainsMono Nerd Font
$wallpaper = ~/.cache/hyprlock-wallpaper

source = ~/.config/hypr/colors-hyprlock.conf


general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}


animations {
    enabled = true

    bezier = smooth, 0.25, 1, 0.5, 1

    animation = fadeIn,  1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
}


background {
    monitor =
    path = $wallpaper

    # ── Background filters ────────────────────────────────────────────
    blur_passes = 3
    blur_size = 7

    brightness = 0.7
    contrast = 0.9

    vibrancy = 0.2
    vibrancy_darkness = 0.1
}


# ── Clock ──────────────────────────────────────────────────────────────

label {
    monitor =

    text = $TIME

    color = $text

    font_size = 90
    font_family = $font

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(00000088)

    position = 0, 80

    halign = center
    valign = center
}


# ── Date ───────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] date +"%A, %d %B"

    color = $subtext0

    font_size = 22
    font_family = $font

    position = 0, -20

    halign = center
    valign = center
}


# ── Input field ────────────────────────────────────────────────────────

input-field {
    monitor =

    size = 280, 50

    outline_thickness = 2
    rounding = 0

    inner_color = rgba(00000030)
    outer_color = $accent

    check_color = $success
    fail_color = $danger

    font_color = $text
    font_family = $font

    placeholder_text = <span foreground="##6c7086">PASSWORD</span>
    fail_text = <span foreground="##f38ba8">$PAMFAIL</span>

    fade_on_empty = false

    dots_spacing = 0.3
    dots_size = 0.3

    position = 0, -100

    halign = center
    valign = center
}


