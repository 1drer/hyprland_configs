# hypridle.conf
# Place at: ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Dim display after 2.5 min
#    Skipped if fullscreen or media playing
#    Skipped if already at or below 20% brightness (avoids jump on low brightness)
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/idle-check.sh bash -c \
        '[[ $(brightnessctl g) -gt $(($(brightnessctl m) / 5)) ]] && brightnessctl -s set 20%'
    on-resume = brightnessctl -r
}

# 2. Turn off displays after 5 min
#    Skipped if fullscreen or media playing
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle-check.sh hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 3. Lock screen after 10 min
#    Skipped if fullscreen or media playing
listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/idle-check.sh loginctl lock-session
}

# 4. Suspend after 15 min
#    NOT guarded — if you've been idle 15 min with nothing playing, suspend anyway
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
